# Build and deploy to the ABAP repository (BSP ZCFO_BRIEF, package ZAI_FSCM_).
# Deploying prompts for a transport if none is set below - see docs/setup.md §5.
specVersion: "4.0"
metadata:
  name: cfo.brief
type: application
framework:
  name: SAPUI5
  version: "1.136.0"
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        ignoreCertError: false
        target:
          url: https://my402244-api.s4hana.cloud.sap
          client: "080"
        app:
          name: ZCFO_BRIEF
          description: CFO Daily Brief
          package: ZAI_FSCM_
          transport: ""                          # <- your transport request
        exclude:
          - /test/
