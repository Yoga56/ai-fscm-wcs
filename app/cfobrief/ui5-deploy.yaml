# Build and deploy to the ABAP repository (BSP ZCFO_BRIEF, package ZCFO_BRIEF).
specVersion: "4.0"
metadata:
  name: cfo.brief
type: application
framework:
  name: SAPUI5
  version: "1.136.0"
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        ignoreCertError: false
        target:
          url: https://my-s4-system.example.com   # <- your system
          client: "100"
        app:
          name: ZCFO_BRIEF
          description: CFO Daily Brief
          package: ZCFO_BRIEF
          transport: ""                          # <- your transport request
        exclude:
          - /test/
